<main id="viewport"><iframe id="game" title="게임 검증 화면" width="390" height="844"></iframe></main>
<script>
const frame=document.querySelector('#game'),scenario=document.querySelector('#scenario'),params=new URLSearchParams(location.search);let session=Date.now().toString(36),width=Number(params.get('width'))||390;
if([...scenario.options].some(o=>o.value===params.get('case')))scenario.value=params.get('case');
function applyWidth(value){width=value;frame.width=String(width);frame.height=String(width>600?936:844);document.querySelectorAll('[data-width]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.width)===width)));}
function openCase(){session=Date.now().toString(36);frame.src='ui-review-game.html?case='+encodeURIComponent(scenario.value)+'&session='+session;document.querySelector('#status').textContent='불러오는 중';}
document.querySelector('#widths').addEventListener('click',e=>{const b=e.target.closest('[data-width]');if(b)applyWidth(Number(b.dataset.width));});scenario.addEventListener('change',openCase);document.querySelector('#fresh').addEventListener('click',openCase);document.querySelector('#reload').addEventListener('click',()=>frame.contentWindow.location.reload());
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==frame.contentWindow||e.data?.kind!=='history-ui-review')return;document.querySelector('#status').textContent=e.data.text;});applyWidth(width);openCase();
</script></body></html>
