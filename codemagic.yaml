# Codemagic: iOS 앱을 빌드해 App Store Connect(TestFlight)에 올린다.
# 준비(한 번만):
#   1) Codemagic 팀 설정 > Integrations > Developer Portal 에 App Store Connect API 키 연결
#      (이름을 아래 integrations.app_store_connect 값과 같게: "history-asc-key")
#   2) Codemagic 앱 설정 > Code signing identities 는 자동 생성(fetch)을 쓰므로 비워 둬도 된다.
# 비밀값(API 키, 인증서)은 이 파일이나 GitHub에 넣지 않는다.
workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: history-asc-key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: korea.history-app
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        BUNDLE_ID: korea.history-app
      node: 22
      xcode: latest
    triggering:
      events: []   # 자동 실행 없이 Codemagic 화면의 'Start new build'로만 실행
    scripts:
      - name: 의존성 설치
        script: npm ci
      - name: 웹 번들 준비 (기출·해설·스토리 데이터 포함)
        script: npm run ios:web
      - name: iOS 프로젝트에 웹 번들 반영
        script: npx cap sync ios
      - name: 서명 설정 (App Store 배포 인증서·프로필 자동 생성)
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: 빌드 번호 올리기 (Codemagic 빌드 번호 사용)
        script: |
          sed -i '' -E "s/CURRENT_PROJECT_VERSION = [0-9]+;/CURRENT_PROJECT_VERSION = ${BUILD_NUMBER:-1};/g" ios/App/App.xcodeproj/project.pbxproj
          grep -m1 "CURRENT_PROJECT_VERSION" ios/App/App.xcodeproj/project.pbxproj
      - name: IPA 빌드
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
