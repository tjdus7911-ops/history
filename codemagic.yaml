# Codemagic: iOS 앱을 빌드해 App Store Connect(TestFlight)에 올린다.
# 준비(한 번만):
#   1) Codemagic 팀 설정 > Integrations > Developer Portal 에 App Store Connect API 키 연결
#      (이름을 아래 integrations.app_store_connect 값과 같게: "눈떠보니 한국사")
#   2) Codemagic > Signing identities 에 Apple Distribution 인증서(생성)와
#      App Store 프로비저닝 프로필(korea.history-app, 가져오기)을 등록해 둔다.
# 비밀값(API 키, 인증서)은 이 파일이나 GitHub에 넣지 않는다.
workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: "눈떠보니 한국사"
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: korea.history-app
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        BUNDLE_ID: korea.history-app
      node: 22
      xcode: latest
    triggering:
      events: []   # 자동 실행 없이 Codemagic 화면의 'Start new build'로만 실행
    scripts:
      - name: 의존성 설치
        script: npm ci
      - name: 웹 번들 준비 (기출·해설·스토리 데이터 포함)
        script: npm run ios:web
      - name: iOS 프로젝트에 웹 번들 반영
        script: npx cap sync ios
      - name: 서명 설정 (Codemagic에 등록한 배포 인증서·프로필 사용)
        script: xcode-project use-profiles
      - name: 빌드 번호 올리기 (Codemagic 빌드 번호 사용)
        script: |
          sed -i '' -E "s/CURRENT_PROJECT_VERSION = [0-9]+;/CURRENT_PROJECT_VERSION = ${BUILD_NUMBER:-1};/g" ios/App/App.xcodeproj/project.pbxproj
          grep -m1 "CURRENT_PROJECT_VERSION" ios/App/App.xcodeproj/project.pbxproj
      - name: IPA 빌드
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
