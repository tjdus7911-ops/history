name: Rev3 UI QA
on:
  push:
    branches: [codex/figma-rev3-20261015]
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright pngjs
      - run: npx playwright install --with-deps chromium
      - name: Baseline mobile captures
        run: |
          set -o pipefail
          git fetch --depth=1 origin f1d88559b494815a22c3ff6e1761b84301b6f958
          git restore --source=f1d88559b494815a22c3ff6e1761b84301b6f958 --worktree dist
          mkdir -p tmp/rev3
          QA_PHASE=before node tests/rev3-mobile-qa.cjs 2>&1 | tee tmp/rev3/before.log
          git restore --source=HEAD --worktree dist
      - name: Rev3 native mobile QA
        if: always()
        run: |
          set -o pipefail
          git restore --source=HEAD --worktree dist
          node tests/rev3-mobile-qa.cjs 2>&1 | tee tmp/rev3/after.log
      - name: Regression checks
        if: always()
        run: |
          mkdir -p tmp/rev3
          failed=0
          node tests/rev3-ui-test.cjs >> tmp/rev3/regression.log 2>&1 || failed=1
          for test in official-content-swipe official-learning-continuation official-exam-history official-exam-pass official-exam-timer official-exam-cover official-source-manifest official-exam-statistics official-choice-ui-data official-content-crop-regression service-worker-cache official-canonical-qa vercel-detail-assets ox-quiz ox-route proto-save-v3 proto-main-preservation three-save-v3 three-learning-boundary story-access-policy; do
            node tests/$test-test.cjs >> tmp/rev3/regression.log 2>&1 || failed=1
          done
          cat tmp/rev3/regression.log
          exit $failed
      - name: Build validation
        if: always()
        run: |
          set -o pipefail
          npm run build 2>&1 | tee tmp/rev3/build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rev3-mobile-qa
          path: tmp/rev3

