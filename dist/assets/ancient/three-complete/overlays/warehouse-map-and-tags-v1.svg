<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536" preserveAspectRatio="xMidYMid slice"><title>청해진 창고의 화물 표지와 교류 거점 개략도</title><desc>당·신라·일본의 표지는 필체가 서로 다르다. 개략도는 신라방과 신라촌을 거주지, 신라소를 관리 기관, 신라원과 적산 법화원을 사찰로 구별한다. 여러 지역의 형성 시기와 사찰 건립·활동 기록의 시기는 본문 옆 기존 설명 자리에서 구분한다. 이 그림은 당시 실물 지도를 복제한 자료가 아니며 모든 거점이 같은 해에 창설되었다고 단정하지 않는다.</desc><g stroke-linecap="round" stroke-linejoin="round"><path d="M307 278L380 278L387 300L415 307L423 320L402 330L407 344L394 360L392 382L379 413L361 455L307 459Z" fill="#937a47" fill-opacity=".25" stroke="#4a3b2b" stroke-width="2"/><path d="M444 293L456 287L469 303L479 328L469 350L453 367L442 354L448 332L437 307Z" fill="#937a47" fill-opacity=".25" stroke="#4a3b2b" stroke-width="2"/><path d="M468 423L482 409L497 415L506 406L511 417L495 431L481 439L468 437Z" fill="#937a47" fill-opacity=".25" stroke="#4a3b2b" stroke-width="2"/><path d="M409 315Q428 348 452 361Q472 379 485 422M389 377Q419 383 452 361" fill="none" stroke="#765d3d" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="409" cy="315" r="3.5" fill="#833f2c"/><circle cx="452" cy="361" r="3.5" fill="#833f2c"/><text x="357" y="314" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="23" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#38291f">唐</text><text x="456" y="383" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="20" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#38291f">新羅</text><text x="487" y="457" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="19" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#38291f">日本</text><text x="373" y="342" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="17" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#38291f">赤山</text><text x="418" y="403" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="15" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#38291f">淸海鎭</text><text x="397" y="253" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="21" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#38291f">海路</text><path d="M522 253V465" stroke="#6e5238" stroke-width="1" opacity=".55"/><text x="535" y="273" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="20" font-weight="500" text-anchor="start" dominant-baseline="central" fill="#38291f">新羅坊</text><text x="724" y="273" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="18" font-weight="400" text-anchor="end" dominant-baseline="central" fill="#38291f">居留</text><text x="535" y="310" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="20" font-weight="500" text-anchor="start" dominant-baseline="central" fill="#38291f">新羅所</text><text x="724" y="310" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="18" font-weight="400" text-anchor="end" dominant-baseline="central" fill="#38291f">管理</text><text x="535" y="347" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="20" font-weight="500" text-anchor="start" dominant-baseline="central" fill="#38291f">新羅院</text><text x="724" y="347" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="18" font-weight="400" text-anchor="end" dominant-baseline="central" fill="#38291f">寺院</text><text x="535" y="384" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="20" font-weight="500" text-anchor="start" dominant-baseline="central" fill="#38291f">新羅村</text><text x="724" y="384" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="18" font-weight="400" text-anchor="end" dominant-baseline="central" fill="#38291f">村落</text><text x="535" y="429" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="20" font-weight="500" text-anchor="start" dominant-baseline="central" fill="#38291f">赤山法華院</text><text x="724" y="429" font-family="Noto Sans CJK KR