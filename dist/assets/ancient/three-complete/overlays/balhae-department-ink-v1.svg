<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536" preserveAspectRatio="xMidYMid slice"><title>발해 3성·6부 문서 표지</title><desc>원문에 나온 3성과 6부의 명칭을 아홉 실제 문서 묶음의 빈 표지에 적는다. 중대성·선조성·정당성, 충부·인부·의부·지부·예부·신부. 서가 배치는 학습 장면의 문서 정리를 위한 가상 구성이며 기관의 고고학적 배치도나 실제 문서의 복제가 아니다. 원문에 없는 세부 직무는 표지에 추가하지 않는다.</desc><g data-department="중대성"><text x="353.5" y="282" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#38291f">中臺省</text></g><g data-department="선조성"><text x="522.0" y="282" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#38291f">宣詔省</text></g><g data-department="정당성"><text x="685.5" y="282" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="25" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#38291f">政堂省</text></g><g data-department="충부"><text x="310.5" y="403" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="21" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#38291f">忠部</text></g><g data-department="인부"><text x="391.5" y="403" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="21" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#38291f">仁部</text></g><g data-department="의부"><text x="471.5" y="403" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="21" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#38291f">義部</text></g><g data-department="지부"><text x="552.5" y="403" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="21" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#38291f">智部</text></g><g data-department="예부"><text x="632.5" y="403" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="21" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#38291f">禮部</text></g><g data-department="신부"><text x="713.5" y="403" font-family="Noto Sans CJK KR,Noto Sans KR,sans-serif" font-size="21" font-weight="500" text-anchor="middle" dominant-baseline="central" fill="#38291f">信部</text></g></svg>
